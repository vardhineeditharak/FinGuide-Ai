<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinGuide-Ai — Personal Financial Assistant</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-viewport">
  <!-- Navigation Bar (Floating Pill style) -->
  <nav class="navigation-bar">
    <div class="brand">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="FinGuide-Ai Logo" class="brand-logo">
      <span class="brand-name">FinGuide-Ai</span>
      <span class="status-indicator-dot"></span>
    </div>
    
    <div class="nav-actions">
      <button class="nav-cta-btn" id="restart-chat-btn">
        Restart Session
      </button>
    </div>
  </nav>

  <!-- Main Centered Layout -->
  <main class="showroom-layout">
    
    <!-- Chat Showroom Panel (Full width, centered) -->
    <section class="chat-showroom">
      <div id="chat-window" class="chat-window">
        
        <!-- Welcome Screen (Dialog Style) -->
        <div class="welcome-container" id="welcome-container">
          <div class="welcome-heading-block">
            <span class="section-badge">FINANCIAL GUARDIAN AI</span>
            <h1>Guiding your decisions with clarity.</h1>
            <p class="welcome-subtext">Secure your transactions, review borrowing options, and manage budgets with real-time AI guidance.</p>
          </div>

          <div class="quick-prompt-chips">
            <button class="prompt-chip" data-q="How do I send money using UPI safely?">UPI Safety</button>
            <button class="prompt-chip" data-q="How can I tell if a call about my bank account is a scam?">Spotting Scams</button>
            <button class="prompt-chip" data-q="What is a safe interest rate for a personal loan?">Loan Rates</button>
            <button class="prompt-chip" data-q="How do I start budgeting my monthly salary?">Budgeting Basics</button>
          </div>
        </div>

      </div>

      <!-- Zero-radius Form and Pill CTA (Tension Design) -->
      <div class="input-showroom-row">
        <form id="chat-form" class="chat-input-form">
          <div class="input-underline-wrapper">
            <input id="chat-input" type="text" placeholder="Ask a financial literacy or safety question..." autocomplete="off" />
          </div>
          <button type="submit" id="send-btn" class="orange-pill-btn" aria-label="Send query">
            <span>Send query</span>
          </button>
        </form>
        <div class="status-meta">
          <div id="status-line" class="status-line"></div>
          <div class="disclaimer-meta">Grounded in RBI & NPCI directives. Not personal investment advice.</div>
        </div>
      </div>
    </section>

  </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
